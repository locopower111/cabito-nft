<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabito – NFTs inspiradores UTADEO</title>
<style>
  :root{
    --brand:#00558F;
    --accent:#A0CFEB;
    --bg:#f8fafc;
    --card:#fff;
    --ink:#0f172a;
  }
  *{box-sizing:border-box}
  body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(90deg,var(--brand),#00A9A4);color:#fff;padding:18px}
  header h1{margin:0;font-size:20px}
  .wrap{padding:18px;max-width:1100px;margin:auto}
  .grid{display:grid;grid-template-columns:360px 1fr;gap:16px}
  .card{background:var(--card);border-radius:10px;padding:12px;border:1px solid #e5e7eb;box-shadow:0 4px 8px rgba(0,0,0,.05)}
  label{display:block;font-size:13px;margin-top:8px;color:#555}
  input[type="text"],textarea,select{width:100%;padding:8px;border-radius:8px;border:1px solid #e5e7eb;margin-top:6px}
  textarea{min-height:80px}
  .btn{display:inline-block;padding:8px 12px;border-radius:8px;border:0;background:var(--brand);color:#fff;cursor:pointer;margin-top:8px}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .nft{border-radius:8px;padding:8px;border:1px solid #e5e7eb;background:#fff;display:flex;flex-direction:column;gap:6px}
  .nft img{border-radius:6px;max-height:160px;object-fit:contain;background:#fff}
  .small{font-size:12px;color:#555}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Cabito – NFTs inspiradores UTADEO</h1>
  <p class="small">Simulación educativa local: crea NFTs inspiradores de Cabito. 100 % offline.</p>
</div></header>

<div class="wrap">
<div class="grid">
  <div class="card">
    <h3>Mintear nuevo Cabito</h3>
    <label>Título</label>
    <input id="title" type="text" placeholder="Cabito edición especial">
    <label>Frase inspiradora</label>
    <select id="phraseSel"></select>
    <textarea id="phraseTxt" placeholder="O escribe tu propia frase..."></textarea>
    <label>Imagen (opcional)</label>
    <input id="imgFile" type="file" accept="image/*">
    <button class="btn" id="mintBtn">Mintear NFT</button>
    <button class="btn ghost" id="resetBtn">Reset</button>
  </div>

  <div class="card">
    <h3>Galería de Cabitos</h3>
    <div id="gallery" class="gallery"></div>
  </div>
</div>
</div>

// --- Estado ---
const KEY="cabito_nfts_v1";
let nfts=[];
function load(){const r=localStorage.getItem(KEY);if(r)nfts=JSON.parse(r);}
function save(){localStorage.setItem(KEY,JSON.stringify(nfts));}

// --- Helpers ---
function uuid(){return([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));}
async function sha256(str){const d=new TextEncoder().encode(str);const h=await crypto.subtle.digest("SHA-256",d);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej();r.readAsDataURL(f);});}

// --- UI ---
const phraseSel=document.getElementById("phraseSel");
const phraseTxt=document.getElementById("phraseTxt");
SEED.forEach((p,i)=>{const o=document.createElement("option");o.textContent=p;o.value=p;phraseSel.appendChild(o);});
phraseSel.addEventListener("change",()=>phraseTxt.value=phraseSel.value);

document.getElementById("mintBtn").onclick=async()=>{
 const title=document.getElementById("title").value||"Cabito edición local";
 const phrase=phraseTxt.value.trim();
 let img=DEFAULT_CABITO_IMG;
 const f=document.getElementById("imgFile").files[0];
 if(f) img=await fileToDataURL(f);
 const id="CAB-"+Math.random().toString(36).slice(2,7).toUpperCase();
 const obj={id,uuid:uuid(),title,phrase,img,ts:new Date().toISOString()};
 obj.hash=await sha256(JSON.stringify(obj));
 nfts.push(obj);save();render();
};

document.getElementById("resetBtn").onclick=()=>{if(confirm("Borrar colección local?")){nfts=[];save();render();}};

// --- Render ---
function render(){
 const g=document.getElementById("gallery");
 g.innerHTML=nfts.slice().reverse().map(n=>`
  <div class='nft'>
    <img src='${n.img}' alt='${n.title}'/>
    <div><b>${n.title}</b></div>
    <div class='small'>${n.phrase}</div>
    <div class='small mono'>${n.hash.slice(0,16)}...</div>
  </div>`).join("")||"<p class='small'>Aún no hay NFTs.</p>";
}

// Go
load();render();
</script>
</body>
</html>
